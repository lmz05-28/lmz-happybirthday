<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廖敏芝生日快乐！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f4c2e0;
            min-height: 2000vh;
            overflow-x: hidden;
            position: relative;
        }

        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            opacity: 0.8;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 120px 20px 1200px;
            color: #a8254f;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 350px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .cake {
            font-size: 5rem;
            margin: 750px 0;
        }

        .guide-text {
            font-size: 1.2rem;
            margin: 900px 0;
            color: #8b1c3a;
        }

        .card {
            background-color: rgba(255,255,255,0.85);
            border-radius: 15px;
            padding: 60px 40px;
            max-width: 500px;
            margin: 1000px auto;
            text-align: left;
            line-height: 2.2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card .love-text {
            font-size: 1.1rem;
            margin-bottom: 18px;
        }

        .invite-btn {
            background-color: rgba(255,255,255,0.9);
            border: 2px dashed #a8254f;
            border-radius: 15px;
            padding: 40px;
            max-width: 300px;
            margin: 1250px auto;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .invite-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .envelope {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .invite-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a8254f;
        }

        .scratch-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .scratch-modal.show {
            display: flex;
        }

        .scratch-card {
            background-color: #fff;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .scratch-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a8254f;
            margin-bottom: 30px;
        }

        .scratch-content {
            background-color: #f8d7e9;
            border-radius: 10px;
            padding: 40px 20px;
            margin: 20px 0;
            line-height: 6.0;
            font-size: 1.1rem;
        }

        .invite-line {
            font-weight: bold;
            color: #a8254f;
        }
    </style>
</head>
<body>
    <div class="floating-container" id="floatingContainer"></div>

    <div class="content">
        <h1 class="title">廖敏芝生日快乐！！</h1>

        <div class="cake">🎂</div>

        <p class="guide-text">往下拉，有惊喜哦~</p>

        <div class="card">
            <p class="love-text">这是我陪你度过的第四个生日啦</p>
            <p class="love-text">19岁生日快乐！！！</p>
            <p class="love-text">愿你身安体泰，欢欣尝在，平顺无忧，吉祥满盈</p>
            <p class="love-text">今天一定要多吃一些好吃的哦</p>
            <p class="love-text">等我明天去找你</p>
        </div>

        <div class="invite-btn" id="inviteBtn">
            <div class="envelope">💌</div>
            <p class="invite-text">邀请函<br>点我打开看看~</p>
        </div>
    </div>

    <!-- 邀请函内容已更新为：邀请你 / 明天晚上8:00 / 共进晚餐 -->
    <div class="scratch-modal" id="scratchModal">
        <div class="scratch-card">
            <span class="close-btn" id="closeBtn">×</span>
            <h2 class="scratch-title">邀请函</h2>
            <div class="scratch-content">
                <p>邀请你</p>
                <p class="invite-line">明天晚上8:00</p>
                <p>共进晚餐</p>
            </div>
        </div>
    </div>

    <script>
        const floatingContainer = document.getElementById('floatingContainer');
        const items = ['❤️', '💖', '💕', '💗', '💝', '🎀', '🎁', '🦋'];
        const maxItems = 30;

        function createFloatingItem() {
            if (floatingContainer.children.length >= maxItems) return;

            const item = document.createElement('div');
            item.classList.add('float-item');
            const randomItem = items[Math.floor(Math.random() * items.length)];
            item.textContent = randomItem;

            const size = Math.random() * 30 + 20;
            item.style.fontSize = `${size}px`;
            item.style.left = `${Math.random() * 100}%`;
            const duration = Math.random() * 10 + 8;
            item.style.animationDuration = `${duration}s`;
            const delay = Math.random() * 5;
            item.style.animationDelay = `${delay}s`;

        floatingContainer.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, (duration + delay) * 1000);
        }

        setInterval(createFloatingItem, 300);

        const inviteBtn = document.getElementById('inviteBtn');
        const scratchModal = document.getElementById('scratchModal');
        const closeBtn = document.getElementById('closeBtn');

        inviteBtn.addEventListener('click', () => {
            scratchModal.classList.add('show');
        });

        closeBtn.addEventListener('click', () => {
            scratchModal.classList.remove('show');
        });

        scratchModal.addEventListener('click', (e) => {
            if (e.target === scratchModal) {
                scratchModal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
