<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老婆生日快乐！</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f4c2e0; /* 淡紫色背景，和你的截图一致 */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* 动态漂浮元素容器（爱心/蝴蝶/礼物） */
        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 漂浮元素通用样式 */
        .float-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            opacity: 0.8;
            z-index: 1;
        }

        /* 向上漂浮动画 */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主内容区（文字和卡片，层级在漂浮元素之上） */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 50px 20px;
            color: #a8254f; /* 深粉色文字，和截图一致 */
        }

        /* 主标题 */
        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 蛋糕图标 */
        .cake {
            font-size: 5rem;
            margin: 20px 0;
        }

        /* 引导语 */
        .guide-text {
            font-size: 1.2rem;
            margin: 30px 0;
            color: #8b1c3a;
        }

        /* 表白卡片 */
        .card {
            background-color: rgba(255,255,255,0.85);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            margin: 50px auto;
            text-align: left;
            line-height: 1.8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card .love-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .card .love-line {
            font-size: 1.1rem;
            font-weight: bold;
            color: #a8254f;
            text-align: center;
            margin-top: 20px;
            font-size: 1.5rem;
        }

        /* 邀请函按钮 */
        .invite-btn {
            background-color: rgba(255,255,255,0.9);
            border: 2px dashed #a8254f;
            border-radius: 15px;
            padding: 30px;
            max-width: 300px;
            margin: 50px auto;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .invite-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .invite-btn .envelope {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .invite-btn .invite-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a8254f;
        }

        /* 刮刮乐弹窗 */
        .scratch-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .scratch-modal.show {
            display: flex;
        }

        .scratch-card {
            background-color: #fff;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .scratch-card .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .scratch-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a8254f;
            margin-bottom: 20px;
        }

        .scratch-content {
            background-color: #f8d7e9;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            line-height: 2;
            font-size: 1.1rem;
        }

        .scratch-content .invite-line {
            font-weight: bold;
            color: #a8254f;
        }
    </style>
</head>
<body>
    <!-- 动态漂浮元素容器（爱心/蝴蝶/礼物会在这里生成） -->
    <div class="floating-container" id="floatingContainer"></div>

    <!-- 主内容区 -->
    <div class="content">
        <h1 class="title">老婆生日快乐！！</h1>
        <div class="cake">🎂</div>
        <p class="guide-text">往下拉，有惊喜哦~</p>

        <!-- 表白卡片（和你截图里的文字一致） -->
        <div class="card">
            <p class="love-text">老婆这是我陪你过的第一个生日嘿嘿</p>
            <p class="love-text">我不知道说什么 但是我还是说一点</p>
            <p class="love-text">就是我知道这段时间一直在吵架啥的</p>
            <p class="love-text">就搞得两个人都很累</p>
            <p class="love-text">以后少和你吵架 少惹你生气</p>
            <p class="love-line">老婆我爱你</p>
        </div>

        <!-- 邀请函按钮 -->
        <div class="invite-btn" id="inviteBtn">
            <div class="envelope">💌</div>
            <p class="invite-text">邀请函<br>点我打开看看~</p>
        </div>
    </div>

    <!-- 刮刮乐弹窗 -->
    <div class="scratch-modal" id="scratchModal">
        <div class="scratch-card">
            <span class="close-btn" id="closeBtn">×</span>
            <h2 class="scratch-title">🎁 刮刮乐 🎁</h2>
            <p>用手指刮开银色涂层~</p>
            <div class="scratch-content">
                <p>邀请你</p>
                <p class="invite-line">明天下午17:00</p>
                <p class="invite-line">万象天地</p>
                <p class="invite-line">XX餐厅</p>
                <p class="invite-line">共进晚餐 ❤️</p>
            </div>
            <p>↑ 刮开灰色区域 ↑</p>
        </div>
    </div>

    <script>
        // 1. 生成漂浮元素（爱心/蝴蝶/礼物）
        const floatingContainer = document.getElementById('floatingContainer');
        const items = ['❤️', '💖', '💕', '💗', '💝', '🎀', '🎁', '🦋']; // 可自行添加更多emoji
        const maxItems = 30; // 页面上同时存在的元素数量

        function createFloatingItem() {
            // 控制元素数量不超过maxItems
            if (floatingContainer.children.length >= maxItems) return;

            const item = document.createElement('div');
            item.classList.add('float-item');
            // 随机选择一个emoji
            const randomItem = items[Math.floor(Math.random() * items.length)];
            item.textContent = randomItem;

            // 随机设置大小、位置、速度、延迟
            const size = Math.random() * 30 + 20; // 大小：20-50px
            item.style.fontSize = `${size}px`;
            item.style.left = `${Math.random() * 100}%`; // 水平位置：0-100%
            const duration = Math.random() * 10 + 8; // 动画时长：8-18秒
            item.style.animationDuration = `${duration}s`;
            const delay = Math.random() * 5; // 动画延迟：0-5秒
            item.style.animationDelay = `${delay}s`;

            floatingContainer.appendChild(item);

            // 动画结束后移除元素，避免页面卡顿
            setTimeout(() => {
                item.remove();
            }, (duration + delay) * 1000);
        }

        // 每300ms生成一个新元素
        setInterval(createFloatingItem, 300);

        // 2. 邀请函按钮点击事件（打开刮刮乐弹窗）
        const inviteBtn = document.getElementById('inviteBtn');
        const scratchModal = document.getElementById('scratchModal');
        const closeBtn = document.getElementById('closeBtn');

        inviteBtn.addEventListener('click', () => {
            scratchModal.classList.add('show');
        });

        // 关闭弹窗
        closeBtn.addEventListener('click', () => {
            scratchModal.classList.remove('show');
        });

        // 点击弹窗背景也能关闭
        scratchModal.addEventListener('click', (e) => {
            if (e.target === scratchModal) {
                scratchModal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
