<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廖敏芝生日快乐！</title>
    <style>
        /* 全局样式重置 & 基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        :root {
            --main-color: #a8254f;
            --light-color: #d84a77;
            --bg-color: #f4c2e0;
            --card-bg: rgba(255, 255, 255, 0.88);
            --shadow: 0 4px 20px rgba(168, 37, 79, 0.15);
        }

        body {
            background: linear-gradient(135deg, #f4c2e0 0%, #f8d7e9 50%, #ffe6ef 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: var(--main-color);
        }

        /* 全局入场动画 */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 滚动渐入动画 */
        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        .fade-in.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 飘落元素容器（爱心/气球/星星） */
        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .float-item {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
            opacity: 0.85;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.85;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(0.6);
                opacity: 0;
            }
        }

        /* 主体内容容器 */
        .main-content {
            position: relative;
            z-index: 10;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
            animation: pageFadeIn 1s ease-out;
        }

        /* 头部标题区 */
        .header {
            text-align: center;
            margin-bottom: 80px;
        }

        .main-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(90deg, #a8254f, #d84a77);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(216, 74, 119, 0.3);
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .sub-title {
            font-size: 1.2rem;
            color: #8b1c3a;
            margin-bottom: 40px;
        }

        /* 滚动引导箭头 */
        .scroll-guide {
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            color: var(--light-color);
            margin-top: 20px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* 蛋糕 + 动态蜡烛区域 */
        .cake-wrap {
            text-align: center;
            margin: 60px 0;
        }
        .cake-icon {
            font-size: clamp(4rem, 12vw, 6rem);
            position: relative;
        }
        .candle {
            display: inline-block;
            font-size: 2rem;
            margin: 0 8px;
            animation: flicker 0.8s infinite alternate;
        }
        @keyframes flicker {
            from { opacity: 0.7; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* 通用卡片样式 毛玻璃效果 */
        .text-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 40px 30px;
            margin: 50px auto;
            box-shadow: var(--shadow);
            line-height: 2.3;
            max-width: 600px;
        }
        .text-card h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--main-color);
            text-align: center;
        }
        .text-card p {
            font-size: 1.05rem;
            color: #701834;
            margin: 12px 0;
        }

        /* 照片预留区域（可自行替换图片） */
        .photo-box {
            max-width: 500px;
            margin: 60px auto;
            text-align: center;
        }
        .photo-placeholder {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--light-color);
            color: var(--main-color);
            font-size: 1.1rem;
        }

        /* 邀请函按钮 */
        .invite-btn {
            background: var(--card-bg);
            border: 2px dashed var(--main-color);
            border-radius: 20px;
            padding: 35px 20px;
            max-width: 320px;
            margin: 70px auto;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        .invite-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 25px rgba(168, 37, 79, 0.25);
            background: rgba(255, 255, 255, 0.95);
        }
        .envelope {
            font-size: 3.2rem;
            margin-bottom: 15px;
        }
        .invite-text {
            font-size: 1.35rem;
            font-weight: bold;
        }

        /* 背景音乐开关 */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .music-control:hover {
            transform: scale(1.1);
        }

        /* 弹窗样式 带过渡动画 */
        .scratch-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .scratch-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .scratch-card {
            background-color: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 92%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }
        .scratch-modal.show .scratch-card {
            transform: scale(1);
        }
        .close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: var(--main-color);
        }
        .scratch-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--main-color);
            margin-bottom: 30px;
        }
        .scratch-content {
            background-color: #f8d7e9;
            border-radius: 15px;
            padding: 45px 20px;
            line-height: 3;
            font-size: 1.15rem;
        }
        .invite-line {
            font-weight: bold;
            color: var(--main-color);
            font-size: 1.25rem;
        }

        /* 底部寄语 */
        .footer-tip {
            text-align: center;
            padding: 40px 20px 20px;
            font-size: 1rem;
            color: #8b1c3a;
        }
    </style>
</head>
<body>
    <!-- 飘落特效层 -->
    <div class="floating-container" id="floatingContainer"></div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop preload="auto">
        <!-- 生日歌在线音源，可自行替换本地音频 -->
        <source src="https://www.soundjay.com/misc/happy-birthday-1.mp3" type="audio/mpeg">
    
    <div class="music-control" id="musicBtn">🔊</div>

    <!-- 主体内容 -->
    <div class="main-content">
        <!-- 头部标题 -->
        <div class="header fade-in">
            <h1 class="main-title">廖敏芝 生日快乐 🎉</h1>
            <p class="sub-title">愿岁岁年年，平安喜乐，万事胜意</p>
            <div class="scroll-guide">↓ 向下滑动查看更多惊喜 ↓</div>
        </div>

        <!-- 蛋糕 + 动态蜡烛 -->
        <div class="cake-wrap fade-in">
            <div class="cake-icon">🎂</div>
            <div class="candle-wrap">
                <span class="candle">🕯️</span>
                <span class="candle">🕯️</span>
                <span class="candle">🕯️</span>
                <span class="candle">🕯️</span>
                <span class="candle">🕯️</span>
            </div>
        </div>

        <!-- 第一块寄语卡片 -->
        <div class="text-card fade-in">
            <h3>暖心碎语</h3>
            <p>这是我陪你度过的第四个生日啦，时光匆匆，庆幸一路有你相伴。</p>
            <p>恭喜你正式迎来美好的19岁，新的一岁，新的篇章。</p>
            <p>愿你眼里有光，心中有爱，一路春暖花开。</p>
        </div>

        <!-- 照片预留位（替换图片直接改这里） -->
        <div class="photo-box fade-in">
            <div class="photo-placeholder">
                📷 此处可以放置你们的合照/生活照
            </div>
        </div>

        <!-- 第二块祝福卡片 -->
        <div class="text-card fade-in">
            <h3>专属祝福</h3>
            <p>愿你身安体泰，欢欣常在，平顺无忧，吉祥满盈。</p>
            <p>生活里满是甜蜜与惊喜，烦恼通通绕道而行。</p>
            <p>今天一定要尽情开心，多吃美食，收下所有美好祝福。</p>
            <p>别忘记啦，明天我就会去找你，期待见面✨</p>
        </div>

        <!-- 邀请函按钮 -->
        <div class="invite-btn fade-in" id="inviteBtn">
            <div class="envelope">💌</div>
            <p class="invite-text">专属邀请函<br>点击打开惊喜</p>
        </div>

        <!-- 底部小寄语 -->
        <div class="footer-tip fade-in">
            愿每一岁都奔走在自己的热爱里，生日快乐！
        </div>
    </div>

    <!-- 邀请函弹窗 -->
    <div class="scratch-modal" id="scratchModal">
        <div class="scratch-card">
            <span class="close-btn" id="closeBtn">×</span>
            <h2 class="scratch-title">💌 正式邀请函</h2>
            <div class="scratch-content">
                <p>诚挚邀请你</p>
                <p class="invite-line">⭐ 明天晚上 20:00 ⭐</p>
                <p>🍽️ 一起共进温馨晚餐 🍽️</p>
                <p>期待与你相见 ❤️</p>
            </div>
        </div>
    </div>

    <script>
        // 1. 飘落特效：爱心、气球、星星、彩带、礼物
        const floatingContainer = document.getElementById('floatingContainer');
        const floatIcons = ['❤️', '💖', '💕', '🎀', '🎁', '🎈', '✨', '🌟', '💝', '🦋'];
        const maxFloatNum = 35;

        function createFloatItem() {
            if (floatingContainer.children.length >= maxFloatNum) return;

            const item = document.createElement('div');
            item.classList.add('float-item');
            item.textContent = floatIcons[Math.floor(Math.random() * floatIcons.length)];

            // 随机大小、位置、动画时长、延迟
            const size = Math.random() * 35 + 18;
            item.style.fontSize = `${size}px`;
            item.style.left = `${Math.random() * 100}%`;
            const duration = Math.random() * 12 + 7;
            item.style.animationDuration = `${duration}s`;
            const delay = Math.random() * 6;
            item.style.animationDelay = `${delay}s`;

            floatingContainer.appendChild(item);

            // 动画结束后移除元素，避免DOM堆积
            setTimeout(() => {
                item.remove();
            }, (duration + delay) * 1000);
        }
        setInterval(createFloatItem, 280);

        // 2. 滚动渐入动画（元素进入视口时淡入）
        const fadeElements = document.querySelectorAll('.fade-in');
        function checkFade() {
            fadeElements.forEach(el => {
                const rect = el.getBoundingClientRect();
                // 元素顶部进入视口60px时触发动画
                if (rect.top < window.innerHeight - 60) {
                    el.classList.add('active');
                }
            });
        }
        window.addEventListener('scroll', checkFade);
        window.addEventListener('load', checkFade);

        // 3. 邀请函弹窗逻辑
        const inviteBtn = document.getElementById('inviteBtn');
        const scratchModal = document.getElementById('scratchModal');
        const closeBtn = document.getElementById('closeBtn');

        inviteBtn.addEventListener('click', () => {
            scratchModal.classList.add('show');
        });
        closeBtn.addEventListener('click', () => {
            scratchModal.classList.remove('show');
        });
        // 点击遮罩关闭弹窗
        scratchModal.addEventListener('click', (e) => {
            if (e.target === scratchModal) {
                scratchModal.classList.remove('show');
            }
        });

        // 4. 背景音乐开关
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let musicPlay = false;

        musicBtn.addEventListener('click', () => {
            if (!musicPlay) {
                bgMusic.play();
                musicBtn.textContent = '🔔';
                musicPlay = true;
            } else {
                bgMusic.pause();
                musicBtn.textContent = '🔊';
                musicPlay = false;
            }
        });
    </script>
</body>
</html>
